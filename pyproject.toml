[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instinct-decision"
version = "0.1.0"
description = "Single-forward-pass runtime for the instinct-tuned-4b decision model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ZooWork Team, Serendipity One Inc." }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
    "torch>=2.8.0a0",
    "transformers==5.16.1",
    "huggingface_hub",
    "accelerate",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
]
test = ["pytest"]

[project.urls]
Homepage = "https://instinct.zoowork.ai/"
Documentation = "https://instinct.zoowork.ai/docs/"
Repository = "https://github.com/SerendipityOneInc/instinct"
"Hugging Face" = "https://huggingface.co/srpone"

[project.scripts]
instinct-decide = "instinct.cli:main"
instinct-serve = "instinct.server:main"

[tool.setuptools.packages.find]
include = ["instinct*"]
