[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instinct-decision"
version = "0.1.0"
description = "Runtime for the Instinct single-forward-pass decision models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "instinct/_vendor/apus_runtime/LICENSE", "instinct/_vendor/reflex/LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
    "torch>=2.8.0a0",
    "transformers==5.16.1",
    "huggingface_hub",
    "accelerate",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
]
test = ["pytest"]

[project.scripts]
instinct-decide = "instinct.cli:main"
instinct-serve = "instinct.server:main"

[tool.setuptools.packages.find]
include = ["instinct*"]

[tool.setuptools.package-data]
"instinct._vendor.apus_runtime" = ["LICENSE", "SOURCE.txt"]
"instinct._vendor.reflex" = ["LICENSE", "SOURCE.txt"]
